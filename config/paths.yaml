# 项目路径配置
# ⚠️ 所有绝对路径已脱敏为 ${REPO_ROOT} 占位符
# 实际加载时请运行 src/utils/resolve_paths.py 自动替换为本地仓库路径

project_root: ${REPO_ROOT}

# 原始数据路径
data:
  raw_attachment1: ${REPO_ROOT}/E题数据/附件1-数据集原始多模态样本
  raw_attachment2: ${REPO_ROOT}/E题数据/附件2-数据集特征文件
  raw_attachment3: ${REPO_ROOT}/E题数据/附件3-模态缺失特征样本
  raw_attachment4: ${REPO_ROOT}/E题数据/附件4-可解释专项视频样本与特征文件

# 处理后数据路径
processed:
  q1_features: ${REPO_ROOT}/data/processed/features_q1
  q1_combined: ${REPO_ROOT}/data/processed/features_q1/q1_features_combined.pkl

# 输出路径
outputs:
  models: ${REPO_ROOT}/outputs/models
  logs: ${REPO_ROOT}/outputs/logs
  tables: ${REPO_ROOT}/outputs/tables
  submissions: ${REPO_ROOT}/outputs/submissions

# 论文路径
paper:
  root: ${REPO_ROOT}/paper
  sections: ${REPO_ROOT}/paper/sections
  figures: ${REPO_ROOT}/paper/figures

# 文档路径
docs:
  root: ${REPO_ROOT}/docs

# 注：
# 1) 早期提交中的完整路径（如 /mnt/data2/home/chenyu/...）需要迁移或重置
# 2) 如需恢复原路径，运行 scripts/restore_paths.py（脚本将检测本地环境并自动还原）
